name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check owned finite models and route publication
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p028-scientific-checks"
          mkdir -p "$out"
          python -B -c 'import json, platform, sys; print(json.dumps({"python": sys.version, "platform": platform.platform(), "scope": "35 finite and routing regressions, including an owned loopback TCP case; not full runtime campaigns"}, indent=2))' > "$out/environment.json"
          timeout --signal=TERM --kill-after=5s 120s \
            prlimit --as=1073741824 --cpu=100 --nofile=512 -- \
            python -B -m unittest tests.test_model tests.test_repair_model tests.test_compact_depth tests.test_topology_reuse tests.test_route_publication -v \
            > "$out/checks.stdout" 2> "$out/checks.stderr"
      - name: Upload raw check output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p028-scientific-checks
          path: ${{ runner.temp }}/p028-scientific-checks/
          if-no-files-found: error
          retention-days: 14
